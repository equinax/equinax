strategy: overnight
version: "3"
description: "隔夜超短 — 动量延续·T+1开盘买T+2开盘卖"

label_cn: 隔夜超短
score_column: overnight_score
eval_period: 2
requires_moneyflow: true
backtest_top_n: 5

scoring:
  positive_factors:
    - signal: daily_return_component
      source: pct_chg
      transform: "((col - 2.0) / 8.0).clip(0.0, 1.0) * 100"
      fill_null: 0.0
      weight: 0.25

    - signal: close_strength_component
      source: close_strength
      transform: "col * 100"
      fill_null: 50.0
      weight: 0.20

    - signal: volume_ramp_component
      source: vol_ramp_5v20
      transform: "((col + 0.5) / 1.5).clip(0.0, 1.0) * 100"
      fill_null: 50.0
      weight: 0.15

    - signal: sector_heat_component
      source: sector_momentum_5d
      transform: "((col + 5.0) / 15.0).clip(0.0, 1.0) * 100"
      fill_null: 0.0
      weight: 0.12

    - signal: moneyflow_component
      source: mf_net_percentile
      fill_null: 50.0
      weight: 0.08

    - signal: elg_flow_component
      source: elg_net_percentile
      fill_null: 50.0
      weight: 0.05

    - signal: short_momentum_component
      source: return_5d
      transform: "((col + 5.0) / 10.0).clip(0.0, 1.0) * 100"
      fill_null: 50.0
      weight: 0.00

    - signal: price_position_component
      source: price_range_position_20d
      transform: "col * 100"
      fill_null: 50.0
      weight: 0.05

  penalties:
    - signal: upper_shadow_penalty
      source: upper_shadow_ratio
      transform: "(col * 5.0).clip(0.0, 1.0) * 100"
      fill_null: 0.0
      weight: 0.08

    - signal: stability_penalty
      source: stability_score
      fill_null: 50.0
      weight: 0.06

    - signal: anti_climax_penalty
      source: climax_score
      transform: "(1 - col) * 100"
      fill_null: 0.0
      weight: 0.06

  pre_filters:
    - column: pct_chg
      op: gte
      value: 2.0

  regime_discount:
    enabled: true

parameter_bounds:
  weights:
    min: 0.02
    max: 0.30
    step: 0.01
  total_positive_weight:
    target: 0.90
    min: 0.80
    max: 0.95
  total_penalty_weight:
    target: 0.20
    min: 0.10
    max: 0.30
  backtest_top_n:
    min: 3
    max: 8
