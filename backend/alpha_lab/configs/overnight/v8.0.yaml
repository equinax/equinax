# Overnight Ultra-Short (隔夜超短) — v8.0 First Uptick Entry
#
# PARADIGM SHIFT from v7:
# v7: "uptrending stocks currently in pullback" → picks mid-decline, no reversal confirmation
# v8: "uptrending stocks at pullback-to-rally transition" → picks first up day after pullback (止跌回升第一升)
#
# KEY CHANGE: Entry timing shifted from "during pullback" to "first uptick after pullback"
#   - pre_filter: prev_consecutive_down_days >= 1 (yesterday was declining)
#   - today must be an up day (implicit via first_uptick_after_pullback > 0)
#   - Anti-patterns: 电广传媒 (doji at top, pullback not bottomed), 正强股份 (mid-decline)
#
# Buy T+1 open, sell T+2 open. Prioritize win-rate over magnitude.

strategy: overnight
version: "8.0"
description: "隔夜超短 — 止跌回升第一升·T+1开盘买T+2开盘卖·弱市回避"

label_cn: 隔夜超短
score_column: overnight_score
eval_period: 2
requires_moneyflow: false
backtest_top_n: 5

scoring:
  positive_factors:
    # First uptick after pullback — THE core entry signal (止跌回升第一升)
    - signal: first_uptick_signal
      source: first_uptick_after_pullback
      transform: "col.clip(5.0, 80.0) / 80.0 * 100"
      fill_null: 0.0
      weight: 0.22

    # 30d uptrend quality (return + rally dominance + smoothness)
    - signal: uptrend_quality_signal
      source: uptrend_score_30d
      transform: "col.clip(20.0, 80.0) / 80.0 * 100"
      fill_null: 0.0
      weight: 0.25

    # Rally > pullback in recent 20d (more green candles, bigger green)
    - signal: rally_dominance_signal
      source: rally_dominance_20d
      transform: "col.clip(30.0, 80.0) / 80.0 * 100"
      fill_null: 0.0
      weight: 0.10

    # Currently near box bottom (low 20d position = entry opportunity)
    - signal: pullback_depth_signal
      source: price_range_position_20d
      transform: "(0.60 - col).clip(0.0, 0.50) / 0.50 * 100"
      fill_null: 0.0
      weight: 0.05

    # Doji / reversal candle signal — wide shadow = pullback exhaustion
    - signal: reversal_candle_signal
      source: shadow_range_pct
      transform: "(col.clip(1.0, 5.0) - 1.0) / 4.0 * 100"
      fill_null: 0.0
      weight: 0.15

    # Controlled moves, not violent swings (anti 反面教材 D)
    - signal: smoothness_signal
      source: cycle_smoothness_20d
      transform: "col.clip(20.0, 80.0) / 80.0 * 100"
      fill_null: 0.0
      weight: 0.05

    # MA alignment confirms uptrend structure
    - signal: ma_trend_signal
      source: ma_alignment_score
      transform: "col.clip(40.0, 95.0) / 95.0 * 100"
      fill_null: 0.0
      weight: 0.10

    # Volume interest confirms reversal
    - signal: volume_interest_signal
      source: volume_ratio_5d
      transform: "(col - 0.5).clip(0.0, 2.0) / 2.0 * 100"
      fill_null: 0.0
      weight: 0.05

    # Low SCI = sector divergence = individual stock alpha opportunity (contrarian edge)
    - signal: sector_divergence_signal
      source: sector_coherence_sci
      transform: "(0.7 - col).clip(0.0, 0.4) / 0.4 * 100"
      fill_null: 0.0
      weight: 0.03

  penalties:
    # Extreme volatility — M-shape, violent swings (反面教材 D)
    - signal: volatility_penalty
      source: return_std_20d
      transform: "(col - 3.0).clip(0.0, 4.0) / 4.0 * 100"
      fill_null: 0.0
      weight: 0.10

  pre_filters:
    # MUST be in uptrend: 30d return > 0%
    - column: return_30d
      op: gt
      value: 0.0
      fill_null: 0.0

    # MUST have had recent pullback: yesterday was a down day
    - column: prev_consecutive_down_days
      op: gte
      value: 1
      fill_null: 0.0

    # Pullback must not have been too long (反面教材 E: 连跌8天以上不要)
    - column: prev_consecutive_down_days
      op: lte
      value: 8
      fill_null: 0.0

    # No catastrophic pullbacks in recent 20d
    - column: max_consecutive_down_20d
      op: lte
      value: 10.0
      fill_null: 0.0

    # Exclude extreme daily drops (tightened from -7.0 in v7.4: losers drop harder)
    - column: pct_chg
      op: gte
      value: -5.0
      fill_null: 0.0

  regime_discount:
    enabled: false

market_gate:
  regime_max: 50
  note: "Contrarian strategy — abstain when regime > 50. Validated across seeds 42/123/55/99."

parameter_bounds:
  weights:
    min: 0.05
    max: 0.40
    step: 0.01
  total_positive_weight:
    target: 1.00
    min: 0.80
    max: 1.00
  total_penalty_weight:
    target: 0.10
    min: 0.00
    max: 0.20
  backtest_top_n:
    min: 3
    max: 8
