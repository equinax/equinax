experiment_id: "exp-20260217-020"
strategy: dragon
created_at: "2026-02-17T11:00:00+08:00"
parent_version: "22"
parent_experiment: "exp-20260217-017"

hypothesis: |
  Add stability_penalty (weight 0.02) to penalize overly stable/dormant stocks.
  Cohen's d = -0.101 for stability_score means pre-limit-up stocks are LESS
  stable (mean=50.97) vs control (53.72). High stability indicates the stock
  is too calm to breakout. Transform: threshold at 60, ramp penalty linearly.
  Total penalty: 0.24→0.26.

changes:
  - path: "scoring.penalties"
    action: "add"
    signal: "stability_penalty"
    source: "stability_score"
    transform: "((col - 60.0).clip(0.0, 40.0) / 40.0) * 100"
    fill_null: 0.0
    weight: 0.02

backtest_params:
  dates: 25
  seed: 42
  tabs: ["dragon"]

results:
  win_rate: 48.7
  avg_return: 1.16
  profit_loss_ratio: 1.90
  vs_baseline:
    win_rate_delta: -7.9
    avg_return_delta: -1.45

decision: revert
decision_reason: |
  WR=48.7% (-7.9pp), catastrophic. Adding penalty for stability hurt badly.
  Even with only 0.02 weight, it changed 7+ dates' stock selections.
  The stability score overlaps with volume_consistency_score (which rewards
  stable volume patterns). Penalizing price stability while rewarding
  volume consistency creates contradictory incentives.

  FINAL ROUND. No more budget for experiments.
