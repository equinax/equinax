decision_reason: |
  WR=52.6% (-4.0pp), AR=1.68% (-0.68pp). Price range position hurt selection.
  Despite d=0.194, the signal may overlap with existing ceiling_penalty which
  already uses price_position_60d — both measure "how close to highs." Adding
  a positive signal for near-high-position while simultaneously penalizing it
  creates conflicting scoring signals. The penalty (ceiling_penalty) is clearly
  more useful for filtering quality.

  INSIGHT: Be careful adding factors that conceptually overlap with existing
  penalties. price_range_position_20d is structurally similar to price_position_60d
  (ceiling_penalty source) — just different timeframes. Adding positive weight
  for "near ceiling" contradicts the penalty for "near ceiling."
