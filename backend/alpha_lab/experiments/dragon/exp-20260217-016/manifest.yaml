decision: keep
decision_reason: |
  WR unchanged at 56.6%, AR improved +0.19pp to 2.55%, P/L improved to 8.23.
  Per-date analysis shows mixed effects: some dates improved (2025-05-12
  WR 75→100%, 2025-11-25 AR -2.90→+0.10), some dates worsened (2025-09-12
  AR 12.17→9.90). Net effect is positive. The factor provides mild momentum
  context that helps distinguish between similarly-scored candidates.

  This is the SECOND successful additive factor (after up_volume_ratio in R7),
  confirming that small tie-breaker signals at minimal weight can work when
  they measure something orthogonal to existing factors.
