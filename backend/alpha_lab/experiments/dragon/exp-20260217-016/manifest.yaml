hypothesis: |
  Add positive_day_ratio_20d (d=0.167) as additive positive factor at minimum
  weight 0.02. Measures fraction of up-days in last 20 sessions.
  Treatment mean=0.5017 vs control=0.4839 — pre-limit-up stocks have slightly
  more up-days. Captures mild positive momentum distinct from volume signals.
  Total positive: 0.87→0.89.

