hypothesis: |
  Reduce backtest_top_n from 4→3 to concentrate on highest-conviction picks.
  Historical precedent: reducing from 5→4 in iter 14 improved WR by +1.2pp
  and AR by +1.27pp. Further tightening may continue the trend.

changes:
  - path: "backtest_top_n"
    action: "modify"
    old_value: 4
    new_value: 3

backtest_params:
  dates: 25
  seed: 42
  tabs: ["dragon"]

results:
  win_rate: 56.6
  avg_return: 2.36
  profit_loss_ratio: 7.89
  vs_baseline:
    win_rate_delta: 0.0
    avg_return_delta: 0.0

decision: revert
decision_reason: |
  Results IDENTICAL to baseline — zero effect. Investigation revealed that
  YAML `backtest_top_n` is NOT used by the backtest script. The script resolves
  top_n from `STRATEGIES[tab].backtest_top_n` (hardcoded Python class at line
  901), ignoring the YAML config entirely. Same class of bug as the config_mode
  forwarding issue found in Round 3.

  BUG REPORT: backtest_top_n in dragon.yaml is cosmetic. To test top_n changes,
  either: (a) modify the Python class (violates config-only constraint), or
  (b) use CLI --top-n flag if available, or (c) fix the backtest script to
  read top_n from config in config_mode.

  For now, top_n experiments are BLOCKED without a code change.
