experiment_id: "exp-20260217-003"
strategy: dragon
created_at: "2026-02-17T09:56:00+08:00"
parent_version: "22"

hypothesis: |
  Multi-factor reweight based on cohort analysis Cohen's d values.
  Rounds 1-2 showed single-factor tweaks don't change top-4 rankings.
  This round applies simultaneous changes:
  1. Reduce zero-discrimination factors: sector_momentum 0.17→0.08 (d=0.029),
     trend_quality 0.15→0.07 (d=-0.005)
  2. Boost strongest discriminators: main_strength 0.10→0.18 (d=0.228),
     accumulation 0.10→0.16 (d=0.213)
  3. Fix direction-contradictory penalty: ceiling_penalty 0.05→0.02
     (price_position_60d d=+0.176, positive signal being penalized)
  4. Keep recent_spike_penalty at 0.03 from Round 2
  Total positive: 0.79, total penalty: 0.18. All within bounds.

changes:
  - path: "scoring.positive_factors[sector_momentum_positive].weight"
    from: 0.17
    to: 0.08
  - path: "scoring.positive_factors[trend_quality_component].weight"
    from: 0.15
    to: 0.07
  - path: "scoring.positive_factors[main_strength_component].weight"
    from: 0.10
    to: 0.18
  - path: "scoring.positive_factors[accumulation_component].weight"
    from: 0.10
    to: 0.16
  - path: "scoring.penalties[ceiling_penalty].weight"
    from: 0.05
    to: 0.02
  - path: "scoring.penalties[recent_spike_penalty].weight"
    from: 0.10
    to: 0.03

backtest_params:
  dates: 25
  seed: 42
  tabs: ["dragon"]

results:
  win_rate: 39.5
  avg_return: -1.05
  profit_loss_ratio: 1.93
  vs_baseline:
    win_rate_delta: -14.4
    avg_return_delta: -3.37
  note: |
    CRITICAL: Rounds 1-2 had a bug where config_mode was not forwarded to
    score_tab(). Those results were running hardcoded scoring, not YAML config.
    Bug fixed in this round. The actual multi-factor reweight result is
    catastrophic: WR dropped 14.4pp, AR dropped 3.37pp.

decision: revert
decision_reason: |
  Catastrophic regression. Multi-factor reweight (reduce SM/TQ, boost MS/ACC,
  reduce penalties) completely destroyed performance. WR=39.5% (-14.4pp),
  AR=-1.05% (-3.37pp). The aggressive shift from low-discrimination factors
  (SM, TQ) to high-discrimination factors (MS, ACC) doesn't work because
  the cohort analysis measures population-level discrimination, not scoring
  efficacy for top-4 selection. Revert all weights to baseline and try
  smaller, single-factor changes now that config-mode actually works.
