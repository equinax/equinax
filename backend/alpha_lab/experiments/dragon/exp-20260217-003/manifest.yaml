hypothesis: |
  Multi-factor reweight based on cohort analysis Cohen's d values.
  Rounds 1-2 showed single-factor tweaks don't change top-4 rankings.
  This round applies simultaneous changes:
  1. Reduce zero-discrimination factors: sector_momentum 0.17→0.08 (d=0.029),
     trend_quality 0.15→0.07 (d=-0.005)
  2. Boost strongest discriminators: main_strength 0.10→0.18 (d=0.228),
     accumulation 0.10→0.16 (d=0.213)
  3. Fix direction-contradictory penalty: ceiling_penalty 0.05→0.02
     (price_position_60d d=+0.176, positive signal being penalized)
  4. Keep recent_spike_penalty at 0.03 from Round 2
  Total positive: 0.79, total penalty: 0.18. All within bounds.

