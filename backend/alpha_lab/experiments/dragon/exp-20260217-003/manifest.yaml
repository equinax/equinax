decision_reason: |
  Multi-factor reweight produced ZERO change — every date result identical to
  baseline. Weight rebalancing among existing 8 factors does not change top-4
  rankings at all. This means either: (1) very few candidates per date (<=4),
  so all get selected regardless; or (2) score gaps are large enough that
  weight changes don't shuffle rankings. Need to investigate scoring mechanics
  and consider adding NEW factors (up_volume_ratio, vol_ramp_5v20, etc.)
  rather than reweighting existing ones.
