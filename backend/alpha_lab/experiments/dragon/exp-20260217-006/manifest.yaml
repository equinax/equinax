experiment_id: "exp-20260217-006"
strategy: dragon
created_at: "2026-02-17T10:20:00+08:00"
parent_version: "22"

hypothesis: |
  Add up_volume_ratio (d=0.197, strong unused signal) as a new positive factor
  at weight 0.05. Compensate by reducing anti_climax from 0.15→0.10.
  up_volume_ratio measures the fraction of volume on up-bars — higher values
  indicate buying pressure dominating selling. Total positive: 0.82 (unchanged).
  Different strategy from Rounds 3-5 (which only reweighted existing factors).

changes:
  - path: "scoring.positive_factors[anti_climax_component].weight"
    from: 0.15
    to: 0.10
  - path: "scoring.positive_factors"
    action: "add"
    signal: "up_volume_ratio_component"
    source: "up_volume_ratio"
    transform: "col * 100"
    fill_null: 50.0
    weight: 0.05

backtest_params:
  dates: 25
  seed: 42
  tabs: ["dragon"]

results:
  win_rate: 51.3
  avg_return: 1.40
  profit_loss_ratio: 7.98
  vs_baseline:
    win_rate_delta: -2.6
    avg_return_delta: -0.92

decision: revert
decision_reason: |
  WR=51.3% (-2.6pp), AR=1.40% (-0.92pp), but P/L=7.98 (+4.61). Adding
  up_volume_ratio improved win/loss ratio dramatically but hurt overall
  WR and AR. The anti_climax reduction likely caused the WR drop (anti_climax
  is a stability filter). Try adding up_volume_ratio WITHOUT reducing
  anti_climax — accept slightly higher total positive weight.
