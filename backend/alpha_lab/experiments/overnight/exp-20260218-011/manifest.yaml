experiment_id: "exp-20260218-011"
strategy: overnight
created_at: "2026-02-18"
parent_version: "7.5"

hypothesis: |
  Add shadow_range_pct >= 6.0 pre-filter to require clear doji/reversal candle.
  
  Discrimination analysis shows shadow_range_pct is the strongest positive
  discriminator (W=7.16 vs L=5.70, Δ=+1.46). Winners have wider shadows,
  indicating more decisive pullback exhaustion. A floor of 6.0 sits between
  the loser mean (5.70) and winner mean (7.16), filtering out weak candles
  while preserving most winners.
  
  Oracle hypothesis #4. Pre-filters have been higher leverage than weight
  changes (v7.4: +1.5pp WR, v7.5: +2.5pp WR from shadow weight boost).
  shadow_range_pct already has the highest weight (0.20) — a pre-filter
  enforces a hard minimum rather than just scoring preference.
  
  Single variable: only add shadow_range_pct >= 6.0 pre-filter.

changes:
  - path: "scoring.pre_filters"
    action: "add"
    filter: { column: shadow_range_pct, op: gte, value: 6.0 }

backtest_params:
  dates: 25
  seeds: [42, 123, 55, 99]
  tabs: ["overnight"]

results:
  cross_seed:
    seed_42: { win_rate: 70.0, avg_return: 1.14, dates: 6 }
    seed_123: { win_rate: 51.4, avg_return: -0.13, dates: 7 }
    seed_55: { win_rate: 48.0, avg_return: -0.09, dates: 5 }
    seed_99: { win_rate: 36.7, avg_return: -2.11, dates: 6 }
  averages:
    win_rate: 51.5
    avg_return: -0.30
  vs_baseline:
    win_rate_delta: -12.7
    avg_return_delta: -1.82

decision: REJECT
decision_reason: |
  Catastrophic degradation across all metrics. WR -12.7pp (64.2→51.5),
  AR -1.82% (+1.52→-0.30). Far exceeds -2pp WR rejection threshold.
  
  Seed 42 improved (+6.7pp WR) but all other seeds collapsed:
    seed 123: -8.6pp WR, AR turned negative
    seed 55: -12.0pp WR, AR turned negative
    seed 99: -16.6pp WR, AR=-2.11%
  
  The 6.0% floor is too aggressive. shadow_range_pct distribution is
  right-skewed — most stocks have values 2-5%. A hard floor at 6.0
  eliminates the majority of the candidate pool, leaving too few
  stocks and forcing selection of lower-quality alternatives.
  
  shadow_range_pct works best as a soft scoring factor (weight=0.20,
  confirmed by v7.5 acceptance) rather than a hard pre-filter cutoff.
  
  LESSON: Discrimination Δ of +1.46 does NOT support a hard pre-filter.
  The winner mean (7.16) and loser mean (5.70) overlap significantly;
  many winners have shadow_range_pct between 3-6%. Hard cutoffs only
  work when distributions are well-separated.
