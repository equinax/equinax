experiment_id: "exp-20260218-003"
strategy: overnight
created_at: "2026-02-18"
parent_version: "7.4"

hypothesis: |
  Increase reversal_candle_signal (shadow_range_pct) weight from 0.15 to 0.20,
  decrease smoothness_signal (cycle_smoothness_20d) weight from 0.10 to 0.05.
  
  Diagnosis: shadow_range_pct has the strongest winner-loser discrimination
  among positive factors (W=7.16 vs L=5.70, Δ=+1.46). Winners show more
  doji/reversal candles. cycle_smoothness_20d is nearly neutral (Δ=-0.24).
  
  Reallocating weight from a neutral factor to a discriminative one should
  improve stock ranking quality without changing total weights.

changes:
  - path: "scoring.positive_factors[reversal_candle_signal].weight"
    from: 0.15
    to: 0.20
  - path: "scoring.positive_factors[smoothness_signal].weight"
    from: 0.10
    to: 0.05

backtest_params:
  dates: 25
  seeds: [42, 123, 55, 99]
  tabs: ["overnight"]

results:
  cross_seed:
    seed_42: { win_rate: 83.3, avg_return: 2.62, profit_loss_ratio: 3.48, dates: 6 }
    seed_123: { win_rate: 60.0, avg_return: 1.12, profit_loss_ratio: 1.92, dates: 7 }
    seed_55: { win_rate: 60.0, avg_return: 1.66, profit_loss_ratio: 16.22, dates: 5 }
    seed_99: { win_rate: 53.3, avg_return: 0.67, profit_loss_ratio: 1.93, dates: 6 }
  averages:
    win_rate: 64.2
    avg_return: 1.52
    dates: 6.0
  vs_baseline:
    win_rate_delta: +2.5
    avg_return_delta: +0.23

decision: accept
decision_reason: |
  Both WR and AR improved. WR +2.5pp (61.7→64.2), AR +0.23% (1.29→1.52).
  Seed 123 jumped +5.7pp WR. Seed 42 AR jumped to 2.62%.
  No seed shows WR regression. Seed 99 AR -0.04% is negligible.
  shadow_range_pct is confirmed as strong discriminative factor for overnight reversal.
