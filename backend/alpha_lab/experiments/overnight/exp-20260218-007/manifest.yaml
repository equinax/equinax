experiment_id: "exp-20260218-007"
strategy: overnight
created_at: "2026-02-18"
parent_version: "7.5"

hypothesis: |
  Tighten return_60d pre-filter from > 0 to > 5.0.
  
  Stocks with barely positive 60d returns (0-5%) are in weak uptrends that
  may reverse easily. Requiring at least 5% ensures genuine upward momentum,
  consistent with the core thesis of "主升段回踩反转".
  
  Pre-filters have been validated as higher leverage than scoring weights.
  v7.4 (pct_chg tightening) was accepted, so this follows the same approach.

changes:
  - path: "scoring.pre_filters[return_60d].value"
    from: 0.0
    to: 5.0

backtest_params:
  dates: 25
  seeds: [42, 123, 55, 99]
  tabs: ["overnight"]

results:
  cross_seed:
    seed_42: { win_rate: 83.3, avg_return: 2.62, dates: 6 }
    seed_123: { win_rate: 60.0, avg_return: 1.12, dates: 7 }
    seed_55: { win_rate: 60.0, avg_return: 1.66, dates: 5 }
    seed_99: { win_rate: 53.3, avg_return: 0.67, dates: 6 }
  averages:
    win_rate: 64.2
    avg_return: 1.52
    dates: 6.0
  vs_baseline:
    win_rate_delta: 0.0
    avg_return_delta: 0.0

decision: null_result
decision_reason: |
  Identical results to v7.5. Top-5 stocks by score all already have return_60d > 5%.
  The pre-filter tightening is redundant because the scoring model (0.30 weight on
  uptrend_quality) already pushes low-return_60d stocks out of top 5. Not counted
  as iteration.
