experiment_id: "exp-20260218-006"
strategy: overnight
created_at: "2026-02-18"
parent_version: "7.5"

hypothesis: |
  Loosen regime gate from regime_max=50 to regime_max=55.
  
  Currently ~25% of dates pass the gate. By loosening to 55, we allow more
  trading dates. The risk is that regime 50-55 dates may have lower WR,
  diluting overall performance. But more dates = more statistical power
  and more trading opportunities.
  
  From v7.1→v7.2 we tightened 55→50 which improved WR. Now with a better
  scoring model (v7.5), the improved stock selection may compensate for
  slightly more permissive market conditions.

changes:
  - path: "market_gate.regime_max"
    from: 50
    to: 55

backtest_params:
  dates: 25
  seeds: [42, 123, 55, 99]
  tabs: ["overnight"]

results:
  cross_seed:
    seed_42: { win_rate: 83.3, avg_return: 2.62, dates: 6 }
    seed_123: { win_rate: 60.0, avg_return: 1.12, dates: 7 }
    seed_55: { win_rate: 60.0, avg_return: 1.66, dates: 5 }
    seed_99: { win_rate: 53.3, avg_return: 0.67, dates: 6 }
  averages:
    win_rate: 64.2
    avg_return: 1.52
    dates: 6.0
  vs_baseline:
    win_rate_delta: 0.0
    avg_return_delta: 0.0

decision: null_result
decision_reason: |
  Identical results to v7.5 baseline. The 25 sampled dates per seed happen
  to not include any dates with regime score between 50-55. The gate change
  had zero effect. Would need a larger date sample or specific regime 50-55
  dates to test this hypothesis properly. Rolled back, not counted as iteration.
