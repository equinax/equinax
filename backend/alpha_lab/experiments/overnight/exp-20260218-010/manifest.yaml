experiment_id: "exp-20260218-010"
strategy: overnight
created_at: "2026-02-18"
parent_version: "7.5"

hypothesis: |
  Add return_60d <= 40 pre-filter to cap overextended 60d runners.
  
  Discrimination analysis shows losers have higher return_60d (L=33.77 vs W=30.31,
  Δ=-3.46). Stocks with 60d return > 40% are in late-stage trend with elevated
  mean-reversion risk — exactly the kind of overextension that fails on overnight
  pullback-reversal entries.
  
  Oracle hypothesis #2. Pre-filters have consistently been higher leverage than
  weight changes (v7.4 pct_chg tightening: +1.5pp WR).
  
  Single variable: only add return_60d <= 40 pre-filter.

changes:
  - path: "scoring.pre_filters"
    action: "add"
    filter: { column: return_60d, op: lte, value: 40.0 }

backtest_params:
  dates: 25
  seeds: [42, 123, 55, 99]
  tabs: ["overnight"]

results:
  cross_seed:
    seed_42: { win_rate: 83.3, avg_return: 2.65, dates: 6 }
    seed_123: { win_rate: 60.0, avg_return: 0.47, dates: 7 }
    seed_55: { win_rate: 56.0, avg_return: 0.74, dates: 5 }
    seed_99: { win_rate: 46.7, avg_return: 0.04, dates: 6 }
  averages:
    win_rate: 61.5
    avg_return: 0.98
  vs_baseline:
    win_rate_delta: -2.7
    avg_return_delta: -0.54

decision: REJECT
decision_reason: |
  WR -2.7pp exceeds -2pp threshold. AR -0.54% also negative.
  Seed 99 catastrophic: -6.6pp WR (53.3→46.7), seed 55 -4pp (60→56).
  Seed 42/123 unchanged on WR but AR degraded.
  
  The return_60d<=40 filter removes some winners along with losers.
  The 3.46pt difference (L=33.77 vs W=30.31) is too small for a hard cutoff.
  Many winning stocks have return_60d in the 35-50 range — cutting at 40 loses them.
