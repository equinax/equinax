  avg_return: 0.16
  profit_loss_ratio: 2.24
  vs_baseline:
    win_rate_delta: -3.7
    avg_return_delta: -1.24

decision: rejected
decision_reason: |
  双重拒绝触发: win_rate_delta=-3.7 (阈值<-2.0), avg_return_delta=-1.24 (阈值<-1.0)。
  rally_dominance_20d 作为正向因子未能改善选股，反而严重损害收益。
  多个原 100% WR 日期 (如 2025-06-03) 降为 0%。
  consolidation 权重削减 (0.15→0.10) 可能是主因——整理充分度对策略核心逻辑很关键。
