experiment_id: "exp-20260224-003"
strategy: weekly
created_at: "2026-02-24"
parent_version: "3"
target_version: "4"

hypothesis: |
  v3 WR=55.1% 距目标 65% 有 9.9pp 差距。0% WR 日期（6个）是主要拖累。
  rally_dominance_20d 度量近20日涨跌日的数量和幅度不对称性，高值=涨日主导。
  加入 rally_dominance_20d (weight=0.05)，从 consolidation 调出 0.05 (0.15→0.10)。
  保持 total_positive_weight=0.85 不变。
  预期：增加动量方向信号，在模糊市场中更好区分赢家和输家。

changes:
  - path: "scoring.positive_factors[+rally_dominance_component]"
    from: null
    to: "signal: rally_dominance_component, source: rally_dominance_20d, weight: 0.05"
  - path: "scoring.positive_factors[consolidation_component].weight"
    from: 0.15
    to: 0.10

