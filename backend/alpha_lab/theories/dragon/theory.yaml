# ============================================================
# 涨停行为微观结构 (从 theory.md 合并)
# ============================================================

behavioral_model:
  lifecycle:
    description: "每一次涨停事件都遵循一个可识别的行为生命周期"
    sequence: "吸筹 → 拉升 → 回踩 → 确认 → 主升 → 分歧 → 退潮"
    target_window: "在吸筹→确认阶段介入，在主升阶段获利。避开分歧→退潮阶段。"
    stages:
      - name: 吸筹
        behavior: "主力低位建仓，压制股价在窄幅震荡"
        volume_price: "缩量横盘，换手率低但稳定递增"
        signals: "accumulation_score↑, vol_cv_10d↓, turnover_change_20d缓升"
      - name: 拉升
        behavior: "试探性拉升，测试抛压和跟风意愿"
        volume_price: "放量上涨，上影线较长"
        signals: "vol_ramp_5v20↑, upper_shadow_ratio↑, main_strength_proxy↑"
      - name: 回踩
        behavior: "洗盘，清洗浮筹，测试支撑位"
        volume_price: "缩量回落，但不破关键均线"
        signals: "post_spike_consolidation↓, price_range_position_20d回中"
      - name: 确认
        behavior: "回踩后企稳，量能再次温和放大"
        volume_price: "低位缩量止跌 + 反弹放量"
        signals: "ma_alignment_score↑, stability_score↓, volume_buildup_quality↑"
      - name: 主升
        behavior: "涨停爆发，连板或大阳线"
        volume_price: "巨量封板，换手率飙升"
        signals: "涨停触发（事件本身）"
      - name: 分歧
        behavior: "多空博弈加剧，市场对后续走势存疑"
        volume_price: "高位放量震荡，涨停后次日大幅高开低走"
        signals: "climax_score↑, exhaustion_at_ceiling↑"
      - name: 退潮
        behavior: "资金撤退，获利盘出逃"
        volume_price: "放量下跌或连续阴线"
        signals: "recent_vol_spike_max↑ + 价格下行"

  operator_types:
    - type: 游资短线操盘
      duration: "1-3日"
      behavior: "快速建仓→猛烈拉升→次日出货。通常选择小市值、题材热点股。"
      volume_price_signature:
        - "突然放巨量(vol_ramp_5v20 > 0.5)，之前无明显吸筹期"
        - "换手率骤升(turn_ramp_5v20极端值)"
        - "封板时间晚（尾盘封板）或反复开板"
        - "上龙虎榜频繁"
      exploitability: "低。爆发性强但持续期短，T+20评估期内大概率已回落。"
      identification: "vol_ramp_5v20极端 + accumulation_score低 + turnover_change_20d无前期爬升"
    - type: 机构主导运作
      duration: "1-4周"
      behavior: "缓慢吸筹→逐步拉升→阶梯式上涨→分批出货。偏好基本面支撑的标的。"
      volume_price_signature:
        - "吸筹期成交量温和放大(accumulation_score持续走高)"
        - "拉升期量价齐升，但上影线短(upper_shadow_ratio低)"
        - "主力资金净流入持续正值(main_strength_proxy↑, mf_net_percentile↑)"
        - "价格沿MA5/MA10稳步推进(ma_alignment_score高)"
      exploitability: "高。持续期匹配T+20评估窗口，胜率和收益均较优。"
      identification: "accumulation_score↑ + main_strength_proxy↑ + ma_alignment_score↑ + vol_cv_10d适中"
    - type: 板块轮动共振
      duration: "1-2周板块级别"
      behavior: "政策/事件驱动，板块内个股依次启动，龙头先涨停带动跟风。"
      volume_price_signature:
        - "板块指数先行走强(sector_momentum_5d↑)"
        - "同板块多只股票同日涨停或近日连续涨停"
        - "个股可能无明显吸筹期，受板块情绪带动"
        - "龙头与跟风的分化：龙头连板，跟风只有首板"
      exploitability: "中等。龙头股持续性好，但跟风股容易次日回落。"
      identification: "sector_momentum_5d显著正值 + 同板块涨停数量 > 2"

  motivation_model:
    flow: "吸引关注 → 上榜(龙虎榜/涨幅榜) → 引入跟风资金 → 手中持仓变现退出"
    implications:
      - "涨停是手段，不是目的 — 操盘方的真正目标是在高位出货"
      - "涨停前必有蓄力 — 除非是纯游资闪电战，否则拉涨停之前必须建仓"
      - "涨停后必有分歧 — 拉涨停本身会暴露意图，引发多空博弈"
      - "持续性取决于筹码结构 — 吸筹充分 + 浮筹清洗到位 = 后续涨停持续性强"
    strategy_implication: |
      我们要找的是吸筹充分但尚未拉升的标的（生命周期的"确认"阶段），
      而不是已经开始拉升的标的（追涨停 = 帮人抬轿）。

emotion_analysis:
  market_emotion_cycle:
    - stage: 冰点
      characteristics: "连板高度降低(max 2-3板)，跌停数 > 涨停数，成交量萎缩"
      impact: "涨停持续性差，但超跌反弹型涨停的T+20收益反而较好"
    - stage: 修复
      characteristics: "首板数量回升，但连板成功率仍低"
      impact: "开始出现机会，但需精选"
    - stage: 升温
      characteristics: "连板高度提升(5板+)，板块轮动加速"
      impact: "最佳窗口期，涨停持续性好"
    - stage: 高潮
      characteristics: "全市场普涨，涨停数量爆发(100+)，情绪极度亢奋"
      impact: "胜率高但选择困难，需防范高潮退潮"
    - stage: 退潮
      characteristics: "龙头股断板，跟风股暴跌，情绪急剧转冷"
      impact: "高危期，避免操作"

  emotion_data_mapping:
    - dimension: 市场活跃度
      factor: sector_momentum_5d
      interpretation: "板块普遍上涨 = 情绪偏暖"
    - dimension: 筹码松动度
      factor: turnover_change_20d
      interpretation: "换手率上升 = 市场参与度提高"
    - dimension: 主力态度
      factors: ["main_strength_proxy", "mf_net_percentile"]
      interpretation: "机构资金流入 = 聪明钱看多"
    - dimension: 趋势确认
      factor: positive_day_ratio_20d
      interpretation: "阳线占比高 = 上涨趋势确立"
    - dimension: 过热预警
      factors: ["climax_score", "recent_vol_spike_max"]
      interpretation: "量价极端 = 情绪过热"

  behavioral_biases:
    - name: 锚定效应
      description: "投资者倾向锚定前高，导致阻力位附近卖压增大。但对龙头股，突破阻力位反而是强势信号。"
      strategy_link: "这是降低ceiling_penalty和resistance_penalty的理论依据"
    - name: 追涨杀跌
      description: "涨停后次日高开低走(分歧)，本质是短线客追涨后获利出逃。"
      strategy_link: "post_spike_consolidation度量了这种行为消退的程度"
    - name: 从众效应
      description: "板块轮动中的跟风效应。"
      strategy_link: "sector_momentum_5d反映了板块级别的情绪共振"
    - name: 损失厌恶
      description: "被套投资者在解套位附近倾向卖出，造成60日高位附近的抛压。但这对龙头股是伪信号——真正的龙头会突破解套盘。"

