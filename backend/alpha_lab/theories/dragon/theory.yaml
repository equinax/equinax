# Dragon Leader (龙头涨停) 理论纲领
# 单一信息源 (Single Source of Truth)
# 本文件供 AI Agent 读取，用于因子分析和迭代决策

strategy: dragon
version: "22"
description: "发掘中线即将起爆涨停的潜力票。以 T+20 收益率和胜率为核心评估指标。"

core_thesis: |
  涨停不是随机事件——它是资金、情绪、结构三者共振的产物。
  本策略从行为学角度出发，通过量价数据反推操盘意图和资金行为，
  在涨停前 T-5 至 T-20 的窗口中捕捉蓄力信号。

  关键假设：
  - 涨停是手段不是目的，操盘方真正目标是在高位出货
  - 涨停前必有蓄力（除纯游资闪电战），拉涨停之前必须建仓
  - 持续性取决于筹码结构——吸筹充分 + 浮筹清洗到位 = 后续持续性强
  - 我们要找吸筹充分但尚未拉升的标的（"确认"阶段），而非已在拉升的（追涨停 = 帮人抬轿）

  目标操盘类型：机构主导运作（1-4周），持续期匹配 T+20 评估窗口。
  规避类型：游资短线操盘（1-3日），爆发性强但持续期短。

eval_period: 20
eval_basis: "T+1 开盘买入, T+20 收盘评估"

