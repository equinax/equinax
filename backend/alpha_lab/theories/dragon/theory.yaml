# Dragon Leader (龙头涨停) 理论纲领
# 结构化版本 — 从 theory.md (Iter 21) 转换
# 本文件供 AI Agent 读取，用于因子分析和迭代决策

strategy: dragon
version: "22"
description: "发掘中线即将起爆涨停的潜力票。以 T+20 收益率和胜率为核心评估指标。"

core_thesis: |
  关注主力资金吸筹蓄力、突破前的量价配合、板块热度轮动，以及避开分配阶段。
  核心逻辑是捕捉涨停前 T-20 至 T-5 日窗口中的蓄力信号。

eval_period: 20
eval_basis: "T+1 开盘买入, T+20 收盘评估"

# 当前性能 (Iter 21, seed 42, 25-date backtest)
# NOTE: 2026-02-17 fresh backtest shows WR=53.9%, AR=2.32%, P/L=3.37
# due to database data updates. The recorded 62.5%/5.90% was from earlier data snapshot.
current_performance:
  iteration: 21
  seed: 42
  dates: 25
  metrics:
    win_rate: 62.5
    avg_return: 5.90
    profit_loss_ratio: 3.82
  fresh_baseline_20260217:
    win_rate: 53.9
    avg_return: 2.32
    profit_loss_ratio: 3.37
    note: "数据库更新后的真实基线，后续迭代以此为准"
  optimized_20260217:
    win_rate: 56.6
    avg_return: 2.61
    profit_loss_ratio: 8.39
    note: "20轮迭代后最优配置：+up_volume_ratio, +positive_day_ratio, surge_penalty 0.08→0.04"
  targets:
    win_rate: 60.0
    avg_return: 5.0
    profit_loss_ratio: 3.0
  baseline:
    win_rate: 56.0
    avg_return: 2.80
    profit_loss_ratio: 2.97

# 因子引用
positive_factors:
  - ref: signals/sector_momentum.yaml
  - ref: signals/trend_quality.yaml
  - ref: signals/anti_climax.yaml
  - ref: signals/main_strength.yaml
  - ref: signals/accumulation.yaml
  - ref: signals/consistency.yaml
  - ref: signals/buildup.yaml
  - ref: signals/elg_flow.yaml

penalties:
  - ref: signals/recent_spike_penalty.yaml
  - ref: signals/surge_penalty.yaml
  - ref: signals/ceiling_penalty.yaml
  - ref: signals/resistance_penalty.yaml

# 前置过滤 (在 screener_service 层面执行)
filters:
  - column: pct_chg
    op: abs_lte
    value: 5.0
  - column: near_limit_up
    op: eq
    value: false
  - column: is_st
    op: neq
    value: 1

backtest_top_n: 4
requires_moneyflow: true

# 知识库：已验证的发现（AI不应重复试错）
validated_findings:
  effective:
    - id: sector_momentum_flip
      description: "板块动量从负信号翻转为正信号，权重递增至0.17均有提升"
      iteration: "3-8"
      impact: "WR +4pp, AR +1pp"
    - id: reduce_main_strength
      description: "降低主力强度权重(0.15→0.10)，因为赢家的主力强度反而更低(delta=-3.6)"
      iteration: 6
      impact: "WR +2pp"
    - id: reduce_breakthrough_penalties
      description: "降低ceiling/resistance惩罚(0.08→0.05)，对龙头候选者来说接近高位/阻力位是看涨突破信号"
      iteration: "19-21"
      impact: "WR +1.3pp, AR +0.22pp"
    - id: top_n_tighten
      description: "Top-N从5→4，第5名推荐一贯最弱，移除后提升"
      iteration: 14
      impact: "WR +1.2pp, AR +1.27pp"
    - id: up_volume_ratio_additive
      description: "添加up_volume_ratio作为附加正因子(w=0.05)，不修改其他权重"
      iteration: "22 (exp-007)"
      impact: "WR +2.7pp (53.9→56.6%), AR +0.04pp"
    - id: positive_day_ratio_additive
      description: "添加positive_day_ratio_20d作为最小权重正因子(w=0.02)"
      iteration: "22 (exp-016)"
      impact: "AR +0.19pp (2.36→2.55%), WR unchanged"
    - id: surge_penalty_halve
      description: "surge_penalty从0.08→0.04，龙头票当日正向动量是强势信号不应过度惩罚"
      iteration: "22 (exp-017)"
      impact: "AR +0.06pp (2.55→2.61%), WR unchanged"

  ineffective:
    - id: full_formula_redesign
      description: "全公式重设计灾难性(WR降8-14pp)"
      iteration: "multiple"
      never_retry: true
    - id: nonlinear_transforms
      description: "反转MS、封顶TQ等非线性变换灾难性(WR降6pp+)"
      iteration: "11-12"
      never_retry: true
    - id: interaction_terms
      description: "TQ×SM交互项替代ELG灾难性(AR=0.70%)"
      iteration: 13
      never_retry: true
    - id: return_5d_penalty
      description: "'已经在涨'对龙头是特征而非缺陷，return_5d惩罚一致性地杀死AR"
      iteration: "5,10"
      never_retry: true
    - id: trend_quality_overweight
      description: "trend_quality权重超过0.15虽是最佳区分指标，提权反而损害AR"
      iteration: "multiple"
      never_retry: true
    - id: conditional_penalty_scaling
      description: "条件型惩罚缩放无增益"
      iteration: "multiple"
      never_retry: true
    - id: sector_momentum_overweight
      description: "SM权重超过0.17: 0.18微弱下降，0.20崩溃"
      iteration: "8-9"
      never_retry: true
    - id: accumulation_minor_upweight
      description: "accumulation 0.10→0.15: 分数偏移不足以改变 top-4 排名，WR/AR 完全无变化"
      iteration: "22 (exp-20260217-001)"
      never_retry: false
      note: "更大幅度调整 (→0.20) 或组合调整仍可尝试"
    - id: spike_penalty_reduction
      description: "spike_penalty 0.10→0.05: WR=46.1% (-10.5pp)，灾难性。虽然d=+0.136(方向矛盾)，但惩罚是必要的质量过滤器"
      iteration: "22 (exp-009)"
      never_retry: true
    - id: ceiling_penalty_below_005
      description: "ceiling_penalty <0.05: WR=53.9% (-2.7pp)。0.05是最优值，低于此让低质量股进入选择"
      iteration: "22 (exp-018)"
      never_retry: true
    - id: resistance_penalty_reduction
      description: "resistance_penalty 0.05→0.02: WR=52.6% (-4.0pp)。尽管d=0.050几乎无区分力，但惩罚对选股质量至关重要"
      iteration: "22 (exp-019)"
      never_retry: true
    - id: vol_ramp_additive
      description: "添加vol_ramp_5v20: WR=47.4% (-9.2pp)。量能加速信号在top-4选股中选出噪音股"
      iteration: "22 (exp-008)"
      never_retry: true
    - id: price_range_position_additive
      description: "添加price_range_position_20d: WR=52.6%。与ceiling_penalty概念重叠（均衡量接近高位），正负矛盾"
      iteration: "22 (exp-010)"
      never_retry: true
    - id: ma_alignment_additive
      description: "添加ma_alignment_score: WR=52.6%。与trend_quality_20d重叠（均衡量趋势结构）"
      iteration: "22 (exp-012)"
      never_retry: true
    - id: uvr_overweight
      description: "up_volume_ratio 0.05→0.08: WR=52.6%。0.05是tie-breaker最优值，增大变成selector则不可靠"
      iteration: "22 (exp-013)"
      never_retry: true
    - id: turnover_change_additive
      description: "添加turnover_change_20d: WR=52.6%。与已有4个量价信号重叠"
      iteration: "22 (exp-014)"
      never_retry: true
    - id: stability_penalty
      description: "添加stability_penalty: WR=48.7%。与volume_consistency概念冲突"
      iteration: "22 (exp-020)"
      never_retry: true

