# 前置过滤 (在 screener_service 层面执行)
filters:
  - column: pct_chg
    op: abs_lte
    value: 5.0
  - column: near_limit_up
    op: eq
    value: false
  - column: is_st
    op: neq
    value: 1

backtest_top_n: 4
requires_moneyflow: true

