v6_summary:
  status: superseded
  note: "v6.2 WR=42.1%, AR=-0.50%. 发现双峰分布: 5/19日期WR=0%"
  structural_conclusion: |
    v6 发现的关键问题：
    1. 在跌势宇宙中选股，本质上选的是退潮期的票
    2. 双峰WR分布: 10/19日期WR>=60%, 5/19日期WR=0%
    3. WR=0%的日期对应大盘T+1卖出（系统性风险）
    4. 信号日市场宽度无法可靠预测T+1走势
    5. 需要从根本上改变选股逻辑

v3_parked_summary:
  status: parked
  park_reason: "Score-return correlation = -0.046, full-pop WR=39.3%, AR=-0.55%"

new_factors:
  - name: return_60d
    file: factors/uptrend_cycle.py
    description: "60日累计收益率百分比"

  - name: uptrend_score_60d
    file: factors/uptrend_cycle.py
    description: "60日上升趋势质量综合评分 (0-100): 结合收益率+涨跌天数比+平稳度"

  - name: rally_dominance_20d
    file: factors/uptrend_cycle.py
    description: "20日涨跌主导比 (0-100): 涨天数>跌天数 + 涨幅>跌幅"

  - name: cycle_smoothness_20d
    file: factors/uptrend_cycle.py
    description: "20日周期平稳度 (0-100): 波动率低=平稳受控"

  - name: max_consecutive_down_20d
    file: factors/uptrend_cycle.py
    description: "20日内最大连跌天数: 低=健康回踩，高=趋势破坏"

existing_factors_used:
  - name: price_range_position_20d
    description: "20日高低区间位置: 低=处于回踩底部"
  - name: shadow_range_pct
    description: "影线幅度百分比: 高=强分歧/十字星"
  - name: ma_alignment_score
    description: "均线对齐评分: 高=多头排列"
  - name: volume_ratio_5d
    description: "5日量比: 高=放量确认"
  - name: return_std_20d
    description: "20日收益波动率: 高=波动剧烈(惩罚)"

pre_filter_logic: |
  1. return_60d > 0: 必须处于60日上升趋势
  2. consecutive_down_days >= 1: 必须有回踩（入场时机）
  3. consecutive_down_days <= 8: 回踩不能太长（趋势未破）
  4. max_consecutive_down_20d <= 10: 近期无大崩
  5. pct_chg >= -7.0: 排除跌停

backtest_top_n: 5
requires_moneyflow: false

regime_discount:
  enabled: false

