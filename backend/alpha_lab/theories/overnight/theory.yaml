validated_findings:
  never_retry:
    - "追涨停动量: v1-v3全部证伪"
    - "纯跌势反弹: v4-v6 WR始终42%左右"
    - "退潮期十字星: 无alpha"
    - "信号日市场宽度作为入场门: 无预测力"
  ineffective:
    - direction: "惩罚高MA对齐(ma_alignment_score>90)"
      experiment: "exp-20260218-001"
      result: "WR -6.5pp (60.2→53.7), 打乱了选股排名，很多原赢家被降级"
      lesson: "24W vs 6L样本中5.54pt差异是噪声，不足以作为惩罚信号"
      never_retry: false
    - direction: "增加volume_ratio_5d权重(0.05→0.10)并降低rally_dominance(0.15→0.10)"
      experiment: "exp-20260218-004"
      result: "WR -9.2pp (64.2→55.0), 所有种子全部下降，seed99暴跌至40%"
      lesson: "volume_ratio_5d的+0.41差异(W=1.64 vs L=1.23)太小, 增权反而引入噪声扰乱排名"
      never_retry: false
    - direction: "缩减top_n从5到3"
      experiment: "exp-20260218-005"
      result: "WR -1.1pp, 跨种子方差极大(range -7.6pp to +6.7pp)"
      lesson: "top_n=3浓缩不稳定, 有些日期第4-5名比1-3名好. 保持top_n=5的多样性"
      never_retry: false
    - direction: "添加uptrend_score_60d<=85预过滤限制过度延伸趋势"
      experiment: "exp-20260218-008"
      result: "WR -0.9pp (64.2→63.3), seed99 -3.3pp降至50%, AR -0.12%"
      lesson: "阈值85太宽松几乎不过滤. uptrend_score跨种子方差大, 硬过滤不可靠"
      never_retry: false
    - direction: "移除ma_trend权重(0.10→0.00): 完全去除ma_alignment_score评分"
      experiment: "exp-20260218-009"
      result: "WR -4.3pp (64.2→59.9), seed42 -10pp(83.3→73.3). AR +0.09%"
      lesson: "即使因子平均区分方向'错误'(L>W by 5.54), 它仍在复合评分中提供有用信息. 完全移除太激进"
      never_retry: true
    - direction: "添加return_60d<=40预过滤限制60日涨幅"
      experiment: "exp-20260218-010"
      result: "WR -2.7pp (64.2→61.5), AR -0.54%. seed99 -6.6pp(53.3→46.7)"
      lesson: "return_60d的L-W差异仅3.46pt, 硬过滤在40处切断了大量赢家. pre-filter需要更大的区分度才有效"
      never_retry: true
    - direction: "添加shadow_range_pct>=6.0预过滤要求明确十字星"
      experiment: "exp-20260218-011"
      result: "WR -12.7pp (64.2→51.5), AR -1.82%(+1.52→-0.30). 灾难性退化"
      lesson: "shadow_range_pct分布右偏, 大部分股票值在2-5%. 硬阈值6.0消除了多数候选池. 该因子适合软评分(weight=0.20已验证)而非硬过滤"
      never_retry: true
  key_insights:
    - "pre-filters比打分更重要"
    - "跌势宇宙基础WR=59.3%但选出top-5后WR=42%"
    - "双峰分布: 系统性市场风险导致5/19日期全输"
    - "波动率是关键排除因子"
    - "regime gate是最高杠杆变量: regime<55时WR=62.5%, regime>55时WR≈25%"
    - "隔夜超短是逆向策略: 在市场不太弱时买入回踩反转"
    - "ma_alignment_score作为惩罚无效: 赢家和输家都有高MA对齐, 差异是噪声"
    - "pct_chg收紧(-7→-5)有效: 信号日跌幅>5%的股票输面大, WR+1.5pp"
    - "shadow_range_pct权重增强有效: 十字星是最佳区分因子(W=7.16 vs L=5.70), 增权后WR+2.5pp AR+0.23%"
