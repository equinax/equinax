validated_findings:
  never_retry:
    - "追涨停动量: v1-v3全部证伪"
    - "纯跌势反弹: v4-v6 WR始终42%左右"
    - "退潮期十字星: 无alpha"
    - "信号日市场宽度作为入场门: 无预测力"
