# Overnight Ultra-Short (隔夜超短) 理论纲领
# 单一信息源 (Single Source of Truth)
# 本文件供 AI Agent 读取，用于因子分析和迭代决策

strategy: overnight
version: "3"
description: "隔夜超短 — 捕捉尾盘强势动量延续，T+1开盘买入，T+2开盘卖出。"

core_thesis: |
  隔夜策略的本质是动量延续博弈，而非稳定持仓。
  核心逻辑完全不同于dragon/rally/weekly——我们寻找的是：
  当日强势收盘的票，次日大概率延续强势开盘。

  利润来源（两段式）：
  1. T+1 日内段：T+1开盘→T+1收盘（日内惯性）
  2. T+2 高开段：T+1收盘→T+2开盘（隔夜信息差溢价）

  关键假设：
  - 尾盘强势收盘（接近涨停/大阳线）是次日高开的最强预测信号
  - 量价配合的强势（放量上涨）比缩量上涨更有持续性
  - 板块热度（板块轮动共振）放大个股隔夜溢价
  - 资金流向（主力净流入/超大单）确认真实买盘而非对敲
  - 市场情绪周期决定整体胜率天花板——情绪退潮期应降低仓位

  核心区别于Dragon策略：
  - Dragon寻找"吸筹完毕即将爆发"的票 → 选的是安静的票
  - Overnight寻找"今天已经爆发、明天继续"的票 → 选的是最热的票
  - Dragon用anti-climax（远离高潮）→ Overnight要pro-climax（拥抱高潮）
  - Dragon惩罚当日涨幅（surge_penalty）→ Overnight奖励当日涨幅
  - Dragon要stability（低波动）→ Overnight要momentum（高动量）

eval_period: 2
eval_basis: "T+1 开盘买入, T+2 开盘卖出（非收盘）"

status: parked
park_reason: |
  Full-population backtest (218 dates, 161 active) conclusively shows negative expected value.
  Daily close-of-day factors cannot predict T+1 open → T+2 open returns.
  Score-return correlation = -0.046 (no predictive power).
  No regime/breadth/moneyflow filter achieves WR > 50%.
  20 single-variable experiments exhausted the factor search space.
  Limit-up universe base rate is itself negative (WR=41.9%, AR=-0.27%).
  Strategy requires intraday/L2/auction data not available in current platform.

