# ============================================================
# 因子设计 — 基于外部研究的定量发现
# ============================================================

positive_factors:
  - signal: daily_return_component
    source: pct_chg
    description: |
      当日涨幅——隔夜策略的核心选股信号。
      研究发现：涨停次日溢价1-2%（均值），涨幅>5%的票次日延续概率显著高于全市场。
      在Dragon中pct_chg被作为惩罚（surge_penalty），但在Overnight中是最重要的正向因子。
    weight: 0.25

  - signal: close_strength_component
    source: close_strength
    description: |
      尾盘收盘强度（close在当日high-low range中的位置）。
      尾盘30分钟价量研究显示：尾盘收盘强度对次日超额收益的T值=6.21。
      收盘价接近日内最高价 = 尾盘有资金护盘/抢筹，次日大概率高开。
    weight: 0.20

  - signal: volume_ramp_component
    source: vol_ramp_5v20
    description: |
      5日vs20日量比加速度。
      放量上涨比缩量上涨更有持续性——量能加速意味着新增资金入场。
      Dragon中vol_ramp曾因选出噪音股而被reject，但overnight的选股逻辑不同：
      我们本就要选"正在放量"的票。
    weight: 0.15

  - signal: sector_heat_component
    source: sector_momentum_5d
    description: |
      板块5日动量——板块轮动共振信号。
      研究发现：情绪发酵期+板块共振时，隔夜溢价率>70%。
      板块热=个股隔夜溢价被放大（板块效应 > 个股效应）。
    weight: 0.12

  - signal: moneyflow_component
    source: mf_net_percentile
    description: |
      资金净流入百分位。
      区分真实买盘vs对敲。主力资金净流入的强势票，次日延续性显著更好。
      在Dragon中d=0.094（弱），但Overnight是T+2超短周期，资金信号更直接。
    weight: 0.08

  - signal: elg_flow_component
    source: elg_net_percentile
    description: |
      超大单净流入百分位。
      超大单（机构/大户）的方向比中小单更有预测力。
      超大单净流入 + 当日涨幅大 = 机构资金在抢筹。
    weight: 0.05

  - signal: short_momentum_component
    source: return_5d
    description: |
      近5日短期动量。
      短期趋势延续效应——过去5天涨的票未来2天继续涨的概率更高。
      归一化处理：将[-10%, +10%]映射到[0, 100]。
    weight: 0.00
    note: "Disabled in v3 (exp-009). Redundant with pct_chg."

penalties:
  - signal: upper_shadow_penalty
    source: upper_shadow_ratio
    description: |
      上影线比例惩罚。
      上影线长=日内冲高回落=抛压大。
      尾盘虽然收盘可能还不错，但冲高回落意味着上方有压力，
      次日高开后容易再次被压。
    weight: 0.08

  - signal: stability_penalty
    source: stability_score
    description: |
      价格稳定度惩罚（反向使用）。
      与Dragon完全相反！Dragon奖励稳定（因为要等20天），
      Overnight惩罚稳定——太稳定的票（银行、电力）隔夜无溢价。
      稳定=boring=无超额收益。
    weight: 0.06

  - signal: anti_climax_penalty
    source: climax_score
    description: |
      反向高潮惩罚——惩罚远离高潮区域的票。
      与Dragon完全相反！Dragon用anti-climax（远离高潮=好），
      Overnight反过来：远离高潮=没有热度=无人关注=隔夜无溢价。
      climax_score高=好（热度高），低=差。所以用(1-climax_score)作为惩罚。
      注意：这其实等效于将climax_score作为正向因子，但用惩罚形式实现更清晰。
    weight: 0.06

# 前置过滤
filters:
  - column: pct_chg
    op: gte
    value: 2.0
    description: "只选当日涨幅>=2%的票。隔夜策略只看强势票，不看弱势/震荡票。"

backtest_top_n: 5
requires_moneyflow: true

regime_discount:
  enabled: true

# ============================================================
# 隔夜行为微观结构
# ============================================================

behavioral_model:
  lifecycle:
    description: "隔夜策略关注的生命周期极短：T日尾盘 → T+2日开盘，仅~18小时窗口"
    sequence: "尾盘强收 → 盘后发酵 → 集合竞价 → 开盘兑现"
    target_window: "在尾盘强势确认阶段买入，在T+2开盘兑现溢价"
    stages:
      - name: 尾盘强收
        behavior: "T日尾盘资金大幅买入，推升股价至接近日内最高"
        volume_price: "尾盘放量上涨，close_strength接近1.0"
        signals: "close_strength↑, pct_chg↑, vol_ramp_5v20↑"
      - name: 盘后发酵
        behavior: "收盘后消息面发酵，利好（政策/业绩/板块事件）扩散"
        volume_price: "无盘中交易，但龙虎榜/大单数据可作参考"
        signals: "mf_net_percentile↑, elg_net_percentile↑, sector_momentum_5d↑"
      - name: 集合竞价
        behavior: "T+1日9:15-9:25集合竞价，市场对信息重新定价"
        volume_price: "竞价量占前日量3%+ = 关注度高 = 高开概率大"
        signals: "无法用T日数据预测，但T日强势是集合竞价高开的先决条件"
      - name: 开盘兑现
        behavior: "T+1日开盘，我们买入；T+2日开盘，我们卖出"
        volume_price: "T+1日惯性决定了我们的盈亏"
        signals: "评估阶段，非选股阶段"

  overnight_profit_patterns:
    - type: 涨停溢价模式
      description: "T日涨停 → T+1高开1-3% → T+2视情况"
      win_rate: "50-55%（全市场），筛选后可达60%+"
      avg_premium: "1-2%均值，但方差大"
      key_filters:
        - "封板时间早（早盘封板 >> 尾盘封板）"
        - "封单比例大（封单金额/成交额 > 5x）"
        - "换手率适中（5-15%最优，过高=出货）"
        - "市值30-100亿最优（48.9%成功率, +8.3%溢价）"
      data_source: "首板打二板研究 (2021-2023, n=12,138)"

    - type: 大阳线延续模式
      description: "T日涨幅5-9% → T+1惯性延续 → 高开或继续涨"
      win_rate: "45-50%"
      avg_premium: "0.5-1.5%"
      key_filters:
        - "放量上涨（vol_ramp_5v20 > 0.3）"
        - "尾盘收在高位（close_strength > 0.8）"
        - "板块热度高（sector_momentum_5d > 2.0）"
      data_source: "日内收益反转因子研究 (BigQuant)"

    - type: 板块共振溢价模式
      description: "板块发酵期内多只个股联动 → 板块内个股隔夜溢价率放大"
      win_rate: "55-65%（情绪发酵期）"
      avg_premium: "1-3%"
      key_filters:
        - "板块5日动量显著正（sector_momentum_5d > 3.0）"
        - "同板块当日多票涨停或大涨"
        - "情绪周期处于升温/高潮期"
      data_source: "板块轮动溢价研究"

  operator_types:
    - type: 隔夜打板客
      duration: "T+1买→T+2卖，1日持仓"
      behavior: "尾盘抢涨停/大阳线，次日高开出局。追求确定性高开溢价。"
      exploitability: "高。这正是本策略的核心逻辑。"
      identification: "pct_chg↑ + close_strength↑ + vol_ramp↑"
    - type: 连板接力客
      duration: "首板进→2板出（或更高板）"
      behavior: "首板票次日高开直接竞价买入，搏二板涨停。"
      exploitability: "中等。需要极强的情绪判断。全市场二板成功率38-46%。"
      identification: "near_limit_up + sector_momentum_5d↑"

emotion_analysis:
  market_emotion_cycle:
    - stage: 冰点
      characteristics: "涨停数极少，全市场缩量"
      impact: "隔夜溢价为负，不建议操作 → regime_discount应大幅打折"
    - stage: 修复
      characteristics: "涨停数回升，但持续性差"
      impact: "隔夜溢价微正，可小仓试探"
    - stage: 升温
      characteristics: "连板高度提升，板块轮动活跃"
      impact: "最佳窗口期，隔夜溢价率>70%"
    - stage: 高潮
      characteristics: "全市场100+涨停，情绪极度亢奋"
      impact: "溢价高但波动也大，需防高潮退潮转折"
    - stage: 退潮
      characteristics: "龙头断板，跟风股崩溃"
      impact: "高危期，隔夜亏损概率大 → 应abstain"

  emotion_data_mapping:
    - dimension: 市场热度
      factor: sector_momentum_5d
      interpretation: "板块普涨 = 情绪偏暖 = 隔夜溢价率高"
    - dimension: 资金活跃度
      factor: vol_ramp_5v20
      interpretation: "量能加速 = 新资金入场 = 延续性好"
    - dimension: 主力态度
      factors: ["mf_net_percentile", "elg_net_percentile"]
      interpretation: "机构资金净流入 = 次日大概率不会大幅低开"
    - dimension: 当日动量
      factor: pct_chg
      interpretation: "涨幅越大，隔夜溢价的期望值越高（但到涨停附近方差也大）"

# 知识库：已验证的发现（AI不应重复试错）
validated_findings:
  effective:
    - id: momentum_archetype_v2
      description: |
        Complete archetype switch from stability to momentum.
        pct_chg as core positive (w=0.25), close_strength (w=0.20), vol_ramp (w=0.15),
        sector_momentum (w=0.12). stability_score and anti-climax flipped to penalties.
        Pre-filter pct_chg >= 2.0 added. Moneyflow enabled.
      iteration: 1
      impact: "WR +12.6pp (43.2→55.8%), AR +0.32pp (0.00→0.32%)"

    - id: remove_return_5d_exp009
      description: |
        Removed return_5d (w=0.05→0.00). Results identical to baseline — return_5d
        has zero impact on overnight ranking. It's redundant with pct_chg (today's
        momentum) and sector_momentum (multi-day trend). Simplifies model.
      iteration: 2
      impact: "No change (WR=55.8%, AR=0.32%). Model simplification."

    - id: add_price_position_20d_exp017
      description: |
        Added price_range_position_20d (w=0.05). Captures where price sits in 20-day
        range. Stocks near 20-day highs have stronger overnight momentum persistence.
        WR unchanged, AR improved +0.11pp. First AR improvement since v2.
      iteration: 2
      impact: "AR +0.11pp (0.32→0.43%), P/L +0.10 (2.33→2.43). WR unchanged at 55.8%."
  ineffective:
    - id: stability_trend_anti_climax_v1
      description: |
        v1配置使用stability/trend/anti-climax因子，选出的是银行、电力、高速公路等
        低波动防御股。这类票隔夜无溢价。WR=43.2%, AR=0.00%。
        隔夜策略需要动量型因子，不是稳定型因子。
      iteration: 0
      never_retry: true

    - id: top_n_4_exp002
      description: |
        Reduced backtest_top_n from 5 to 4. WR=55.3% (-0.5pp), AR=0.12% (-0.20pp),
        P/L=1.37 (-0.96). Both WR and AR decreased. Fewer picks means more concentration
        risk without improving quality. top_n=5 is better for overnight.
      iteration: 2
      never_retry: true

    - id: pct_chg_filter_3_exp003
      description: |
        Raised pre-filter pct_chg from >=2.0 to >=3.0. Results identical to baseline
        (WR=55.8%, AR=0.32%). This confirms top-5 picks already have pct_chg > 3%.
        The 2.0 filter is not binding — no need to tighten it.
      iteration: 2
      never_retry: false
      note: "Not harmful, just no effect. Could revisit if other changes shift the population."

    - id: pct_chg_overweight_exp004
      description: |
        Increased pct_chg weight 0.25→0.30, reduced sector_momentum 0.12→0.07.
        WR=50.5% (-5.3pp), AR=-0.29% (-0.61pp), P/L=2.20. Severe regression.
        Over-weighting raw return reduces diversification across signals.
        pct_chg=0.25 is the right balance.
      iteration: 2
      never_retry: true

    - id: up_volume_ratio_exp005
      description: |
        Added up_volume_ratio as new positive factor (w=0.05), reduced elg 0.05→0.03
        and return_5d 0.05→0.02. WR=50.5% (-5.3pp), AR=-0.33% (-0.65pp), P/L=2.10.
        up_volume_ratio hurts overnight (unlike dragon where it helped). Different
        strategy archetypes have different factor sensitivities.
      iteration: 2
      never_retry: true

    - id: sector_overweight_exp006
      description: |
        Increased sector_momentum 0.12→0.17, reduced vol_ramp 0.15→0.10.
        WR=54.7% (-1.1pp), AR=0.39% (+0.07pp), P/L=1.48 (-0.85).
        Mixed result: WR decreased, AR slightly improved. Net negative due to
        WR regression. sector_momentum=0.12 and vol_ramp=0.15 remain optimal.
      iteration: 2
      never_retry: true

    - id: remove_stability_penalty_exp007
      description: |
        Removed stability_penalty entirely (w=0.06→0.00). WR=46.3% (-9.5pp),
        AR=-0.66% (-0.98pp). Catastrophic regression. stability_penalty is CRITICAL
        even with pct_chg>=2% filter — it differentiates boring vs exciting strong stocks.
      iteration: 2
      never_retry: true

    - id: remove_anti_climax_penalty_exp008
      description: |
        Removed anti_climax_penalty entirely (w=0.06→0.00). WR=45.3% (-10.5pp),
        AR=-0.72% (-1.04pp). Even worse than removing stability. anti_climax is
        ESSENTIAL — it favors stocks in hot/climax state (high climax_score).
      iteration: 2
      never_retry: true

    - id: moneyflow_overweight_exp010
      description: |
        Increased mf_net_percentile 0.08→0.13 (took weight from removed return_5d).
        WR=52.6% (-3.2pp), AR=-0.04% (-0.47pp). Moneyflow signal is noisy at higher
        weight — 0.08 is the sweet spot.
      iteration: 2
      never_retry: true

    - id: upper_shadow_overweight_exp011
      description: |
        Increased upper_shadow_penalty 0.08→0.14. WR=53.7% (-2.1pp), AR=0.22% (-0.21pp).
        Over-penalizing upper shadows removes good candidates. 0.08 is optimal.
      iteration: 2
      never_retry: true

    - id: close_strength_overweight_exp012b
      description: |
        Increased close_strength 0.20→0.26. WR=54.7% (-1.1pp), AR=0.29% (-0.14pp).
        Despite T-value=6.21, over-weighting close_strength crowds out other signals.
        0.20 is the right weight.
      iteration: 2
      never_retry: true

    - id: top_n_8_exp013
      description: |
        Increased top_n from 5 to 8. WR=42.8% (-13.0pp), AR=-0.86% (-1.25pp).
        Catastrophic. More picks = diluted quality. Overnight needs concentration.
      iteration: 2
      never_retry: true

    - id: top_n_3_exp014
      description: |
        Decreased top_n from 5 to 3. WR=52.6% (-3.2pp), AR=-0.20% (-0.63pp).
        Over-concentration hurts. top_n=5 is optimal (3, 4, 8 all tested and worse).
      iteration: 2
      never_retry: true

    - id: pct_chg_transform_range_exp015
      description: |
        Changed pct_chg transform range from (2-10) to (3-8). WR=54.7% (-1.1pp),
        AR=0.11% (-0.32pp). Compressing the range doesn't help. Original 2-10 is fine.
      iteration: 2
      never_retry: true

    - id: vol_ramp_tighter_transform_exp016
      description: |
        Changed vol_ramp transform from (-0.5,1.0)→(0.0,1.0) range. WR=47.4% (-8.4pp),
        AR=-0.48% (-0.75pp). Severe regression. Including negative vol_ramp values
        (with offset) provides better granularity than hard-clipping at 0.
      iteration: 2
      never_retry: true

    - id: accumulation_replace_elg_exp018
      description: |
        Replaced elg_net_percentile with accumulation_score (w=0.05).
        WR=52.6% (-3.2pp), AR=0.19% (-0.24pp). accumulation_score is worse than
        elg for overnight — elg (超大单) captures institutional intent more directly.
      iteration: 2
      never_retry: true

    - id: momentum_quality_replace_elg_exp019
      description: |
        Replaced elg_net_percentile with momentum_quality_ratio (w=0.05).
        WR=51.6% (-4.2pp), AR=0.05% (-0.38pp). momentum_quality measures consistency
        over 10 days which is irrelevant for 1-day overnight horizon.
      iteration: 2
      never_retry: true

    - id: stability_penalty_overweight_exp020
      description: |
        Increased stability_penalty 0.06→0.10. WR=52.6% (-3.2pp), AR=-0.15% (-0.58pp).
        Over-penalizing removes too many candidates. 0.06 is optimal.
      iteration: 2
      never_retry: true

    - id: anti_climax_overweight_exp021
      description: |
        Increased anti_climax_penalty 0.06→0.10. WR=50.5% (-5.3pp), AR=-0.11% (-0.54pp).
        Same as stability — penalty weights at 0.06 each are fine-tuned correctly.
      iteration: 2
      never_retry: true

    - id: turnover_change_replace_elg_exp023
      description: |
        Replaced elg_net_percentile with turnover_change_20d (w=0.05).
        WR=50.5% (-5.3pp), AR=-0.03% (-0.46pp). Turnover acceleration doesn't
        predict overnight returns. elg is more informative.
      iteration: 2
      never_retry: true

    - id: price_position_overweight_exp024
      description: |
        Increased price_range_position_20d 0.05→0.10, dropped elg to 0.00.
        WR=52.6% (-3.2pp), AR=0.22% (-0.21pp). Overweighting position factor
        at expense of elg hurts. Both need to coexist at 0.05.
      iteration: 2
      never_retry: true
    - id: limit_up_filter_structural
      description: |
        Replaced pct_chg >= 2.0 filter with near_limit_up == True (limit-up stocks only).
        Tested scoring top-5 from limit-up universe. WR=38.5%, AR=-0.58%.
        WORSE than pct_chg>=2% baseline (WR=39.3%, AR=-0.55%).
        The scoring model actively selects wrong limit-up stocks.
        Raw limit-up universe base rate: WR=41.9%, AR=-0.27% (also negative).
      iteration: 3
      never_retry: true

    - id: regime_abstention_tuning
      description: |
        Tested 16 abstention scenarios on full population (218 dates, 161 active).
        Best single filter: mf_inflow >= 50% → 44 dates, WR=43.6%, AR=+0.15%.
        Best combo: regime>=60 & breadth>=55 → 43 dates, WR=45.6%, AR=-0.01%.
        NO combination achieves WR > 50%. More aggressive abstention trades activity
        for marginal WR improvement but never reaches profitability threshold.
      iteration: 3
      never_retry: true
      note: "Structural ceiling — regime cannot save a model with zero alpha."

    - id: score_quality_gate
      description: |
        Tested score-based quality gates (avg_score >= 55/60/65).
        All made WR WORSE (38.6-38.8% vs 39.3% baseline).
        Score-return correlation = -0.046 — score has no predictive power.
        Score quintile analysis: Q1-Q4 essentially flat, Q5 marginal (+0.03% AR).
      iteration: 3
      never_retry: true

  structural_conclusion: |
    Full population analysis (218 dates, 161 active, 57 abstained) reveals:
    1. Score has ZERO predictive power for overnight returns (Pearson r = -0.046)
    2. Win/lose dates are indistinguishable by regime/breadth/moneyflow signals
    3. Catastrophic asymmetry: 16.1% of dates are total wipeouts (WR=0%)
    4. Best dates have NO distinguishing pre-market features
    5. Even limit-up universe base rate is negative (WR=41.9%, AR=-0.27%)
    6. 20 single-variable experiments + 3 structural experiments all confirm
    7. Daily EOD factors fundamentally cannot predict overnight returns

    Root cause: overnight returns are driven by post-close information:
    - Order book dynamics, pre-market auction sentiment, overnight news
    - Institutional block trades, social media amplification
    - These signals don't exist in our T-day close data

    Potential revival paths (require new data sources):
    - L2 order book data (封单量/撤单比例)
    - Pre-market auction data (集合竞价量价)
    - 连板高度 tracking (board height dynamics)
    - Intraday tick data (30-minute bars, VWAP)
    - Social media/forum sentiment (雪球/东财股吧热度)

  unexplored_parked:
    - "main_strength_proxy — parked, not expected to change structural ceiling"
    - "volume_buildup_quality — parked"
    - "post_spike_consolidation — parked"
    - "ma_alignment_score — parked"
    - "positive_day_ratio_20d — parked"
    - "All remaining untested factors are daily EOD factors with same structural limitation"

