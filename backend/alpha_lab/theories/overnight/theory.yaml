# Overnight Ultra-Short (隔夜超短) 理论纲领 v7
# 单一信息源 (Single Source of Truth)
# 本文件供 AI Agent 读取，用于因子分析和迭代决策

strategy: overnight
version: "7.2"
description: "隔夜超短 v7.2 — 主升段回踩反转 + 弱市回避门控(regime≤50)。T+1开盘买入，T+2开盘卖出。"

core_thesis: |
  v7 范式转移：从"跌势反弹"转向"主升段回踩反转"。

  关键转变：
  - v1-v3: 追涨停/强势票 → 全市场负期望值 (WR=39.3%), 已证伪
  - v4-v5: 纯反转模式 (十字星/超卖/假突破) → WR=42.5%, 仍不达标
  - v6: 数据驱动因子替换 → WR=42.1%, 发现双峰分布 (5/19日期WR=0%)
  - v7: 要求60天上升趋势背景，只在主升段的回踩中寻找入场机会

  v7 核心假设：
  1. 主升段（60日正收益+涨跌天数比偏多+波动平缓）的股票，回踩后反弹概率高
  2. 退潮期（60日下跌）的十字星/反转信号没有alpha，必须排除
  3. 波动剧烈（M型/振幅大）的股票不可预测，必须惩罚
  4. 回踩深度适中（1-8天），太长说明趋势已破
  5. 多头排列（MA对齐）确认上升结构

  理想形态（来自图表分析 2026-02-18）：
  A. 立霸股份: 60日升势，拉升>回踩，处于回踩转拉升的早期
  B. 播恩集团: 温和连续上涨，短回踩后十字星，控制良好
  C. 君逸数码: 主升期，五次回踩，动能足，十字星后反弹
  
  反面教材：
  D. *ST智胜: 振幅剧烈，M型，前期跌幅太大
  E. 益方/英联: 退潮期20+天阴跌的十字星，反抽赢面小

  利润来源（两段式不变）：
  1. T+1 日内段：T+1开盘→T+1收盘（惯性延续）
  2. T+2 高开段：T+1收盘→T+2开盘（隔夜信息差溢价）

eval_period: 2
eval_basis: "T+1 开盘买入, T+2 开盘卖出（非收盘）"

status: active

