strategy: weekly
version: "3.0"
description: "做稳定的5个交易日内短线收益。不追高、不追涨停、不赌方向。"

core_thesis: |
  选择低波动、高一致性、蓄力充分的品种，在 T+1 买入后 T+6 评估收益。
  公式天然构成超卖反弹选择器(anti_climax + consolidation + consistency)。

eval_period: 5
eval_basis: "T+1 开盘买入, T+6 收盘评估"

current_performance:
  iteration: 20
  seed: 42
  metrics:
    win_rate: 55.1
    avg_return: 1.40
    profit_loss_ratio: 12.36
  targets:
    win_rate: 65.0
    avg_return: 1.5
  status: converged

positive_factors:
  - ref: signals/anti_climax.yaml
  - ref: signals/consistency.yaml
  - ref: signals/consolidation.yaml
  - ref: signals/trend_quality.yaml
  - ref: signals/buildup.yaml
  - ref: signals/accumulation.yaml
  - ref: signals/momentum_quality.yaml
  - ref: signals/stability.yaml

penalties:
  - ref: signals/recent_spike_penalty.yaml
  - ref: signals/resistance_penalty.yaml
  - ref: signals/surge_penalty.yaml

filters:
  - column: pct_chg
    op: abs_lte
    value: 5.0
  - column: near_limit_up
    op: eq
    value: false
  - column: is_st
    op: neq
    value: 1

backtest_top_n: 3
requires_moneyflow: false

capability_envelope:
  strengths:
    - id: oversold_rebound
      description: |
        公式在低位蓄力环境下表现最佳。100% WR日期的共性:
        price_position_60d < 0.20, return_5d为负, ma_alignment偏低。

  weaknesses:
    - id: uniform_hot_market
      description: |
        当市场全面上涨后，所有候选的因子值趋同(ma_alignment ~98,
        price_position_60d 0.35-0.58)，线性加权公式无法产生区分度。
        这是信息量问题，非权重问题。

validated_findings:
  effective:
    - id: stability_score_addition
      description: "新增 stability_score (weight=0.05)，anti_climax 0.20→0.15。WR +0.3pp, AR +0.35pp"
      iteration: 17
      experiment: exp-20260224-001
      version: "2"
    - id: top_n_concentration
      description: "backtest_top_n 5→3，集中选股。WR +7.8pp, AR +0.57pp"
      iteration: 18
      experiment: exp-20260224-002
      version: "3"

  ineffective:
    - id: price_position_60d_penalty
      description: "惩罚高位: 均匀热市场下阈值不触发，其他日期误伤赢家"
      iteration: 16
      never_retry: true
    - id: price_position_60d_bonus
      description: "奖励低位: 改善3个日期但伤害3个，零和博弈"
      iteration: 16
      never_retry: true
    - id: moneyflow_any
      description: "Regime-dependent，信号方向不一致"
      iteration: 16
      never_retry: true
    - id: ma_alignment_any
      description: "Regime-dependent，与胜负无稳定相关"
      iteration: 16
      never_retry: true
    - id: return_5d_penalty
      description: "与price_position_60d同理"
      iteration: 16
      never_retry: true
    - id: rally_dominance_any
      description: "动量方向信号与超卖反弹核心逻辑不匹配，WR -3.7pp, AR -1.24pp"
      iteration: 19
      never_retry: true
    - id: cycle_smoothness_replacement
      description: "替换momentum_quality→cycle_smoothness，WR -2.7pp, AR -0.34pp。momentum_quality有隐藏正向贡献"
      iteration: 20
      never_retry: true

  assessment: |
    v3 是20轮迭代后的最终最优版本 (WR=55.1%, AR=1.40%, P/L=12.36)。
    相比原始 v1 (WR=47.0%, AR=0.48%, P/L=7.28)：WR +8.1pp, AR +0.92pp, P/L +5.08。
    有效改进: stability_score 因子 (iter 17) + top_n 5→3 集中选股 (iter 18)。
    后续 4 次迭代 (rally_dominance, cycle_smoothness) 均被拒绝，表明线性加权公式
    在当前因子集合下已接近局部最优。突破需要非线性方法或新数据源。

scoring_weights_reference:
  positive:
    - { signal: anti_climax, source: climax_score, weight: 0.15, note: "远离高潮顶部" }
    - { signal: consistency, source: volume_consistency_score, weight: 0.15, note: "成交量稳定可靠" }
    - { signal: consolidation, source: post_spike_consolidation, weight: 0.15, note: "放量后整理充分" }
    - { signal: trend_quality, source: trend_quality_20d, weight: 0.10, note: "20日趋势质量" }
    - { signal: buildup, source: volume_buildup_quality, weight: 0.10, note: "量能逐步堆积" }
    - { signal: accumulation, source: accumulation_score, weight: 0.10, note: "持续性资金流入" }
    - { signal: momentum_quality, source: momentum_quality_ratio, weight: 0.05, note: "动量质量" }
    - { signal: stability, source: stability_score, weight: 0.05, note: "收益波动率稳定性 (v2新增)" }
  penalties:
    - { signal: recent_spike_penalty, source: recent_vol_spike_max, weight: 0.10, note: "异常放量冲高" }
    - { signal: resistance_penalty, source: resistance_proximity_penalty, weight: 0.10, note: "接近阻力位" }
    - { signal: surge_penalty, source: pct_chg, weight: 0.05, note: "当日涨跌幅>3%" }

iteration_milestones:
  - iteration: "v1.0"
    note: "初始公式设计，基于全景/聪明钱/深度价值三套公式的共性提炼"
  - iteration: "v1.0 Iter 16"
    metrics: { win_rate: 67.6, avg_return: 1.31, profit_loss_ratio: 3.33 }
    note: "超卖反弹假设检验。两次尝试均退步，回滚。确认局部最优。"
  - iteration: "v2.0 Iter 17"
    metrics: { win_rate: 47.3, avg_return: 0.83, profit_loss_ratio: 7.82 }
    note: "新增 stability_score 因子 (weight=0.05)，anti_climax 0.20→0.15。WR +0.3pp, AR +0.35pp vs 实测基线。"
    head_promoted_from: "1"
    head_promoted_to: "2"
  - iteration: "v3.0 Iter 18"
    metrics: { win_rate: 55.1, avg_return: 1.40, profit_loss_ratio: 12.36 }
    note: "backtest_top_n 5→3。WR +7.8pp, AR +0.57pp。集中选股大幅改善。"
    head_promoted_from: "2"
    head_promoted_to: "3"
  - iteration: "Iter 19"
    metrics: { win_rate: 51.4, avg_return: 0.16, profit_loss_ratio: 2.24 }
    note: "rally_dominance_20d 因子添加。REJECTED: WR -3.7pp, AR -1.24pp。动量方向信号不匹配。"
    decision: rejected
  - iteration: "Iter 20 (FINAL)"
    metrics: { win_rate: 52.4, avg_return: 1.06, profit_loss_ratio: 6.12 }
    note: "cycle_smoothness_20d 替换 momentum_quality。REJECTED: WR -2.7pp。迭代收敛，v3 确认为最终版本。"
    decision: rejected
